[pytest]
testpaths = app/tests tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    performance: Performance tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
addopts = 
    --verbose
    --capture=no
    --strict-markers
    -ra
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-branch
