[tool.poetry]
name = "naetra"
version = "0.1.0"
description = "Neural Adaptive Engine for Trading and Research Analysis"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
aioredis = "2.0.1"
sqlalchemy = "2.0.19"
aiosqlite = "0.19.0"
asyncpg = "0.28.0"
greenlet = "2.0.2"
fastapi = {extras = ["all"], version = "0.100.0"}
uvicorn = {extras = ["standard"], version = "0.23.1"}
python-jose = {extras = ["cryptography"], version = "3.3.0"}
python-multipart = "0.0.6"
alembic = "1.11.1"
httpx = "0.24.1"
pydantic = "2.0.3"
pydantic-settings = "2.0.3"
psycopg2-binary = "^2.9.10"
urllib3 = "1.26.15"
passlib = "1.7.4"
bcrypt = "3.2.0"

[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
scikit-learn = "1.3.0"
numpy = "1.25.1"
pandas = "2.0.3"
pandas-ta = "0.3.14b0"
scipy = "1.11.1"
statsmodels = "0.14.0"

[tool.poetry.group.market]
optional = true

[tool.poetry.group.market.dependencies]
yfinance = "0.2.25"
alpha-vantage = "2.3.1"
finnhub-python = "2.4.18"

[tool.poetry.group.nlp]
optional = true

[tool.poetry.group.nlp.dependencies]
nltk = "3.8.1"
textblob = "0.15.3"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "7.4.0"
pytest-asyncio = "0.21.1"
pytest-cov = "4.1.0"
pytest-mock = "3.11.1"
aioresponses = "0.7.4"
freezegun = "1.2.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=app --cov-report=term-missing"
